<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小戴发票导出器 - 专业文档处理工具</title>
    <script src="https://mp-ed01968e-26df-4373-b4c3-36b55c3faf13.cdn.bspapp.com/tailwindcss.js"></script>
  
    <script src="https://mp-ed01968e-26df-4373-b4c3-36b55c3faf13.cdn.bspapp.com/jspdf.umd.min.js"></script>
    <script src="https://mp-ed01968e-26df-4373-b4c3-36b55c3faf13.cdn.bspapp.com/pdf.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', 'sans-serif', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'],
                    },
                    colors: {
                        primary: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            200: '#fecaca',
                            300: '#fca5a5',
                            400: '#f87171',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 40px -10px rgba(220, 38, 38, 0.3)',
                        'card': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'float': '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
                        'mobile': '0 -4px 20px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #fef2f2 0%, #fff1f2 50%, #fef2f2 100%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .gradient-text {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 毛玻璃效果 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(254, 202, 202, 0.2);
        }

        .glass-panel-mobile {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
        }

        /* 浮动装饰 */
        .floating-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -50px) scale(1.05);
            }

            50% {
                transform: translate(-20px, 30px) scale(0.95);
            }

            75% {
                transform: translate(-30px, -20px) scale(1.02);
            }
        }

        /* 动画 */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.6s ease-out forwards;
        }

        /* 按钮样式 */
        .btn-primary {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(220, 38, 38, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #374151;
            border: 1px solid #fecaca;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border-color: #f87171;
            transform: translateY(-1px);
        }

        .tool-btn {
            background: white;
            border: 1px solid #fecaca;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:hover {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border-color: #f87171;
            transform: translateY(-1px);
        }

        /* 按钮状态样式 */
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f5f5f5 !important;
            color: #999 !important;
            border-color: #e0e0e0 !important;
        }

        .btn-disabled:hover {
            background: #f5f5f5 !important;
            border-color: #e0e0e0 !important;
            transform: none;
            box-shadow: none;
        }

        .btn-disabled:hover::before {
            display: none;
        }

        .btn-active {
            opacity: 1;
            cursor: pointer;
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%) !important;
            color: white !important;
            border-color: #f87171 !important;
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.25) !important;
        }

        .btn-active:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(248, 113, 113, 0.35) !important;
        }

        /* 不同按钮的颜色主题 */
        .btn-active.export-image {
            background: linear-gradient(135deg, #86efac 0%, #4ade80 100%) !important;
            border-color: #86efac !important;
            box-shadow: 0 4px 15px rgba(134, 239, 172, 0.25) !important;
        }

        .btn-active.export-image:hover {
            box-shadow: 0 20px 25px -5px rgba(134, 239, 172, 0.35) !important;
        }

        .btn-active.export-pdf {
            background: linear-gradient(135deg, #93c5fd 0%, #60a5fa 100%) !important;
            border-color: #93c5fd !important;
            box-shadow: 0 4px 15px rgba(147, 197, 253, 0.25) !important;
        }

        .btn-active.export-pdf:hover {
            box-shadow: 0 20px 25px -5px rgba(147, 197, 253, 0.35) !important;
        }

        .btn-active.print-preview {
            background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 100%) !important;
            border-color: #c4b5fd !important;
            box-shadow: 0 4px 15px rgba(196, 181, 253, 0.25) !important;
        }

        .btn-active.print-preview:hover {
            box-shadow: 0 20px 25px -5px rgba(196, 181, 253, 0.35) !important;
        }

        .btn-active.add-image {
            background: linear-gradient(135deg, #fdba74 0%, #fb923c 100%) !important;
            border-color: #fdba74 !important;
            box-shadow: 0 4px 15px rgba(253, 186, 116, 0.25) !important;
        }

        .btn-active.add-image:hover {
            box-shadow: 0 20px 25px -5px rgba(253, 186, 116, 0.35) !important;
        }

        .btn-active.add-pdf {
            background: linear-gradient(135deg, #fca5a5 0%, #f87171 100%) !important;
            border-color: #fca5a5 !important;
            box-shadow: 0 4px 15px rgba(252, 165, 165, 0.25) !important;
        }

        .btn-active.add-pdf:hover {
            box-shadow: 0 20px 25px -5px rgba(252, 165, 165, 0.35) !important;
        }

        .btn-active.clear-canvas {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%) !important;
            border-color: #fbbf24 !important;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.25) !important;
        }

        
        /* 红色圈悬停效果 */
        .btn-disabled:hover {
            position: relative;
        }

        .btn-disabled:hover::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px solid #dc2626;
            border-radius: inherit;
            pointer-events: none;
            animation: pulseRed 1.5s infinite;
        }

        @keyframes pulseRed {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4);
            }
            70% {
                box-shadow: 0 0 0 4px rgba(220, 38, 38, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
            }
        }

        /* 荣耀浏览器修复 */
        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            nav, .pagination-controls, .pagination-controls-mobile, #canvas {
                position: relative !important;
                -webkit-transform: translateZ(0);
                transform: translateZ(0);
            }
        }

        /* 移动端通用修复 */
        @media (max-width: 768px) {
            .fixed, .sticky {
                -webkit-transform: translateZ(0);
                transform: translateZ(0);
            }
        }

        /* 响应式调整 */
        .mobile-title-hidden {
            display: block;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* 画布样式 */
        .canvas-wrapper {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(254, 202, 202, 0.3);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .canvas-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(220, 38, 38, 0.03) 1px, transparent 0);
            background-size: 20px 20px;
            pointer-events: none;
        }

        #canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* 分页控件 */
        .pagination-controls {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.6) 100%);
            border: 2px solid rgba(254, 202, 202, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .pagination-controls::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(220, 38, 38, 0.3),
                    transparent);
        }

        /* 固定定位的分页控件 */
        .pagination-controls.fixed {
            position: fixed !important;
            bottom: 30px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 1000 !important;
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(20px) !important;
            border: 2px solid rgba(254, 202, 202, 0.3) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
            border-radius: 16px !important;
            padding: 16px 24px !important;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .pagination-controls.fixed {
                bottom: 20px !important;
                padding: 12px 16px !important;
                gap: 8px !important;
                max-width: calc(100vw - 40px) !important;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .pagination-controls.fixed {
                bottom: 15px !important;
                padding: 10px 12px !important;
                gap: 6px !important;
                max-width: calc(100vw - 20px) !important;
                font-size: 14px;
            }
        }

        .page-btn {
            background: white;
            border: 2px solid #fecaca;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .page-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(220, 38, 38, 0.1),
                    transparent);
            transition: left 0.5s;
        }

        .page-btn:hover::before {
            left: 100%;
        }

        .page-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border-color: #f87171;
            color: #dc2626;
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(248, 113, 113, 0.2);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .page-info {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border: 2px solid #fecaca;
            position: relative;
            overflow: hidden;
        }

        .page-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(220, 38, 38, 0.2),
                    transparent);
        }

        /* 质量选择器 */
        .quality-selector {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(254, 202, 202, 0.3);
        }

        /* 进度条 */
        .progress-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(254, 202, 202, 0.3);
        }

        .progress-fill {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {

            /* 触摸优化 */
            .touch-manipulation {
                touch-action: manipulation;
            }

            /* 图片信息 */
            .image-info {
                display: flex;
                gap: 16px;
                justify-content: center;
                margin-top: 16px;
                flex-wrap: wrap;
            }

            .image-item {
                background: rgba(255, 255, 255, 0.8);
                padding: 8px 12px;
                border-radius: 8px;
                font-size: 12px;
                color: #6b7280;
                border: 1px solid #fecaca;
            }
        }

            </style>

<body class="font-sans text-gray-800 overflow-x-hidden relative pb-0 md:pb-0 mb-0">

    <!-- 顶部导航 - 响应式 -->
    <nav
        class="relative z-50 glass-panel sticky top-0 border-b border-red-100 mobile-header-compact transition-all duration-300 bg-white/90">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex items-center justify-between">
            <!-- Logo区域 -->
            <div class="flex items-center gap-2 md:gap-3">
                <div
                    class="w-8 h-8 md:w-10 md:h-10 rounded-lg md:rounded-xl bg-gradient-to-br from-red-500 to-red-700 flex items-center justify-center text-white shadow-lg">
                    <span class="text-sm md:text-lg">📄</span>
                </div>
                <div class="mobile-title-hidden">
                    <h1 class="text-lg md:text-xl font-bold gradient-text tracking-tight">小戴发票导出器</h1
                    <p class="text-xs text-gray-500 font-medium"><span class="mr-1">🐴</span>小马过河&nbsp;&&nbsp;
                </div>
            </div>

            <!-- 桌面端打印功能菜单 -->
            <div class="hidden md:flex items-center gap-3">
                <!-- 导出图片按钮 -->
                <button class="px-3 py-2 rounded-lg text-sm font-medium text-white bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 transition-all duration-300 flex items-center gap-2 shadow-md hover:shadow-lg" id="exportBtn" onclick="exportImage()" disabled>
                    <span class="text-sm">🖼️</span>
                    <span>导出图片</span>
                </button>
                
                <!-- 导出PDF按钮 -->
                <button class="px-3 py-2 rounded-lg text-sm font-medium text-white bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 transition-all duration-300 flex items-center gap-2 shadow-md hover:shadow-lg" id="exportPdfBtn" onclick="exportPDF()" disabled>
                    <span class="text-sm">📑</span>
                    <span>导出PDF</span>
                </button>
                
                <!-- 打印预览按钮 -->
                <button class="px-3 py-2 rounded-lg text-sm font-medium text-white bg-gradient-to-r from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 transition-all duration-300 flex items-center gap-2 shadow-md hover:shadow-lg" id="printPreviewBtn" onclick="previewPrint()" disabled>
                    <span class="text-sm">🖨️</span>
                    <span>打印预览</span>
                </button>
                
                <div class="h-8 w-px bg-red-200"></div>
                
                <!-- 系统状态 -->
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span>系统就绪</span>
                </div>
            </div>

            <!-- 移动端菜单按钮 -->
            <button
                class="md:hidden w-auto min-w-[100px] h-12 flex items-center justify-center rounded-xl bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-medium px-4 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105"
                onclick="toggleMobileMenu()">
                <span class="text-lg mr-2">⬇️</span>
                <span class="text-sm font-semibold">导出</span>
            </button>
        </div>

        <!-- 移动端下拉菜单 -->
        <div id="mobileMenu"
            class="hidden md:hidden absolute top-full left-0 right-0 glass-panel-mobile border-b border-red-100 shadow-lg">
            <div class="px-4 py-3 space-y-2">
                <!-- 导出功能 -->
                <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-50 text-gray-700 mobile-export-btn" onclick="exportImage()" disabled>
                    <span class="text-green-500">🖼️</span>
                    <span>导出图片</span>
                </button>
                
                <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-50 text-gray-700 mobile-export-pdf-btn" onclick="exportPDF()" disabled>
                    <span class="text-blue-500">📑</span>
                    <span>导出PDF</span>
                </button>
                
                <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-50 text-gray-700 mobile-print-preview-btn" onclick="previewPrint()" disabled>
                    <span class="text-purple-500">🖨️</span>
                    <span>打印预览</span>
                </button>
                
                <div class="border-t border-red-100 my-2"></div>
             
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-7xl mx-auto px-4 md:px-6 py-4 md:py-8 space-y-4 md:space-y-6 bg-gradient-to-b from-transparent to-white/50">

        <!-- 标题区域 - 响应式 -->
        <div class="text-center space-y-1 md:space-y-2 animate-slide-up px-2">
            <h2 class="text-xl md:text-3xl font-bold text-gray-800">上传图片或PDF文件</h2>
            <p class="text-sm md:text-base text-gray-500">自动排版为A4尺寸并导出，支持批量处理与智能识别</p>
        </div>

        <!-- 主操作区 - 响应式 -->
        <div class="glass-panel rounded-xl md:rounded-2xl p-4 md:p-6 shadow-glow animate-slide-up"
            style="animation-delay: 0.1s;">

            <!-- 主要按钮组 - 移动端横向滚动，桌面端网格 -->
            <div
                class="flex md:flex-wrap items-center gap-2 md:gap-4 mb-4 md:mb-8 overflow-x-auto hide-scrollbar pb-2 md:pb-0 md:justify-center">
                <!-- 主按钮 -->
                <button
                    class="btn-primary text-white px-4 md:px-8 py-3 md:py-4 rounded-xl font-semibold flex items-center gap-2 md:gap-3 shadow-lg group flex-shrink-0 touch-manipulation"
                    onclick="document.getElementById('mainFileInput').click()">
                    <div
                        class="w-8 h-8 md:w-10 md:h-10 rounded-lg bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <span class="text-base md:text-lg">📁</span>
                    </div>
                    <div class="text-left">
                        <div class="text-sm md:text-base opacity-90">选择文件</div>
                        <div class="hidden md:block text-xs opacity-75">支持图片/PDF</div>
                    </div>
                </button>

                <div class="hidden md:block h-12 w-px bg-red-200 mx-2"></div>

                <!-- 工具按钮 - 移动端紧凑 -->
                <button
                    class="tool-btn btn-secondary px-4 md:px-6 py-3 md:py-4 rounded-xl font-medium flex items-center gap-2 text-gray-700 flex-shrink-0"
                    onclick="document.getElementById('imageInput').click()">
                    <span class="text-red-500">➕</span>
                    <span class="text-sm md:text-base">续加图片</span>
                </button>

                <button
                    class="tool-btn btn-secondary px-4 md:px-6 py-3 md:py-4 rounded-xl font-medium flex items-center gap-2 text-gray-700 flex-shrink-0"
                    onclick="document.getElementById('pdfInput').click()">
                    <span class="text-red-500">📑</span>
                    <span class="text-sm md:text-base">续加PDF</span>
                </button>

                <button
                    class="tool-btn btn-secondary px-4 md:px-6 py-3 md:py-4 rounded-xl font-medium flex items-center gap-2 text-gray-700 flex-shrink-0"
                    id="previewBtn" onclick="clearCanvas()" disabled>
                    <span class="text-orange-500">🗑️</span>
                    <span class="text-sm md:text-base">清空页面</span>
                </button>

            </div>

            <!-- 进度条 -->
            <div class="progress-container rounded-lg p-4 hidden" id="progressContainer">
                <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
                    <div class="progress-fill h-2 rounded-full transition-all duration-300" id="progressFill"
                        style="width: 0%"></div>
                </div>
                <div class="text-sm text-gray-600 text-center" id="progressText">处理中...</div>
            </div>

            <!-- 质量选择器 -->
            <div class="quality-selectors-container mb-4 md:mb-8">
                <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-2 gap-3 md:gap-4">

    <input type="file" id="mainFileInput" accept="image/*,.pdf" multiple style="display: none;">

    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        // 荣耀浏览器简单修复
        setTimeout(() => {
            const nav = document.querySelector('nav');
            const canvas = document.querySelector('#canvas');
            const pagination = document.querySelector('.pagination-controls');
            const paginationMobile = document.querySelector('.pagination-controls-mobile');
            
            // 强制重绘，防止重复显示
            [nav, canvas, pagination, paginationMobile].forEach(el => {
                if (el) {
                    el.style.display = 'none';
                    el.offsetHeight; // 触发重绘
                    el.style.display = '';
                }
            });
        }, 500);

        // 获取DOM元素
        const mainFileInput = document.getElementById('mainFileInput');
        const imageInput = document.getElementById('imageInput');
        const pdfInput = document.getElementById('pdfInput');

        // A4尺寸设置 (21cm x 29.7cm, 300 DPI 高清)
        const A4_WIDTH = 2480;  // 21cm * 300 DPI / 2.54 (竖版)
        const A4_HEIGHT = 3508; // 29.7cm * 300 DPI / 2.54 (竖版)
        const A4_LANDSCAPE_WIDTH = 3508;  // 29.7cm * 300 DPI / 2.54 (横版)
        const A4_LANDSCAPE_HEIGHT = 2480; // 21cm * 300 DPI / 2.54 (横版)

        // 布局模式相关变量
        let currentLayoutMode = 'landscape'; // 'portrait' 或 'landscape'，默认横版

        // 三列竖版布局常量
        const SECTION_HEIGHT = A4_HEIGHT / 3; // 每张图片的高度
        const INVOICE_SPACING = 20; // 发票之间的间隔距离（像素）
        const INVOICE_LINE_HEIGHT = 3; // 分隔线高度（像素）
        const MAX_IMAGES_PER_PAGE = 3; // 每页最多图片数量

        // 横版布局常量（2x2网格）
        const LANDSCAPE_SECTION_WIDTH = A4_LANDSCAPE_WIDTH / 2; // 每张图片的宽度
        const LANDSCAPE_SECTION_HEIGHT = A4_LANDSCAPE_HEIGHT / 2; // 每张图片的高度
        const LANDSCAPE_INVOICE_SPACING = 15; // 横版发票之间的间隔距离（像素）
        const LANDSCAPE_MAX_IMAGES_PER_PAGE = 4; // 横版每页最多图片数量

        const MAX_PAGES = 10; // 最多页数限制

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const exportBtn = document.getElementById('exportBtn');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const previewBtn = document.getElementById('previewBtn');
        const printPreviewBtn = document.getElementById('printPreviewBtn');
        const status = document.getElementById('status');
        const imageInfo = document.getElementById('imageInfo');
        const pdfQualitySelect = document.getElementById('pdfQuality');
        const qualityInfo = document.getElementById('qualityInfo');

        // 获取续加按钮
        const addImageButton = document.querySelector('button[onclick*="imageInput"]');
        const addPdfButton = document.querySelector('button[onclick*="pdfInput"]');
        const mainFileButton = document.querySelector('button[onclick*="mainFileInput"]');

        // 获取当前PDF渲染质量
        function getPdfRenderScale() {
            return pdfQualitySelect ? parseFloat(pdfQualitySelect.value) : 4.0;
        }

        // 获取是否启用自动裁剪
        function isAutoCropEnabled() {
            const autoCropElement = document.getElementById('autoCrop');
            return autoCropElement ? autoCropElement.checked : true;
        }

        // 获取PDF导出质量
        function getPdfExportQuality() {
            const pdfExportQualityElement = document.getElementById('pdfExportQuality');
            return pdfExportQualityElement ? parseFloat(pdfExportQualityElement.value) : 2.0;
        }

        // 获取当前布局模式
        function getCurrentLayoutMode() {
            const layoutModeElement = document.getElementById('layoutMode');
            return layoutModeElement ? layoutModeElement.value : 'landscape';
        }

        // 获取当前布局的最大图片数
        function getMaxImagesPerPage() {
            return getCurrentLayoutMode() === 'landscape' ? LANDSCAPE_MAX_IMAGES_PER_PAGE : MAX_IMAGES_PER_PAGE;
        }

        // 获取当前画布尺寸（始终保持相同尺寸，不随布局模式改变）
        function getCurrentCanvasSize() {
            // 始终返回竖版A4尺寸，不随布局模式改变
            return { width: A4_WIDTH, height: A4_HEIGHT };
        }

        // 初始化按钮状态（页面初次加载时）
        function initializeButtonStates() {
            const hasImages = uploadedImages.length > 0;
            
            // 主文件选择按钮
            if (mainFileButton) {
                mainFileButton.disabled = hasImages;
                if (hasImages) {
                    mainFileButton.classList.add('btn-disabled');
                    mainFileButton.classList.remove('btn-active');
                } else {
                    mainFileButton.classList.remove('btn-disabled');
                    mainFileButton.classList.remove('btn-active');
                }
            }
            
            // 续加按钮
            if (addImageButton) {
                addImageButton.disabled = !hasImages;
                if (hasImages) {
                    addImageButton.classList.remove('btn-disabled');
                    addImageButton.classList.add('btn-active');
                } else {
                    addImageButton.classList.add('btn-disabled');
                    addImageButton.classList.remove('btn-active');
                }
            }
            
            if (addPdfButton) {
                addPdfButton.disabled = !hasImages;
                if (hasImages) {
                    addPdfButton.classList.remove('btn-disabled');
                    addPdfButton.classList.add('btn-active');
                } else {
                    addPdfButton.classList.add('btn-disabled');
                    addPdfButton.classList.remove('btn-active');
                }
            }
            
            // 导出和清空按钮
            if (exportBtn) {
                exportBtn.disabled = !hasImages;
                if (hasImages) {
                    exportBtn.classList.remove('btn-disabled');
                    exportBtn.classList.add('btn-active');
                } else {
                    exportBtn.classList.add('btn-disabled');
                    exportBtn.classList.remove('btn-active');
                }
            }
            
            if (exportPdfBtn) {
                exportPdfBtn.disabled = !hasImages;
                if (hasImages) {
                    exportPdfBtn.classList.remove('btn-disabled');
                    exportPdfBtn.classList.add('btn-active');
                } else {
                    exportPdfBtn.classList.add('btn-disabled');
                    exportPdfBtn.classList.remove('btn-active');
                }
            }
            
            if (previewBtn) {
                previewBtn.disabled = !hasImages;
                if (hasImages) {
                    previewBtn.classList.remove('btn-disabled');
                    previewBtn.classList.add('btn-active');
                } else {
                    previewBtn.classList.add('btn-disabled');
                    previewBtn.classList.remove('btn-active');
                }
            }
            
            if (printPreviewBtn) {
                printPreviewBtn.disabled = !hasImages;
                if (hasImages) {
                    printPreviewBtn.classList.remove('btn-disabled');
                    printPreviewBtn.classList.add('btn-active');
                } else {
                    printPreviewBtn.classList.add('btn-disabled');
                    printPreviewBtn.classList.remove('btn-active');
                }
            }
        }

        // 清空画布后的按钮状态
        function initializeButtonStatesAfterClear() {
            // 清空后的状态：续加功能可用，初始文件选择也可用
            addImageButton.disabled = false;
            addPdfButton.disabled = false;
            exportBtn.disabled = true;
            exportPdfBtn.disabled = true;
            previewBtn.disabled = true;
            printPreviewBtn.disabled = true;
            mainFileButton.disabled = false;
        }

        // 更新按钮状态（有文件时）
        function updateButtonStatesWithFiles() {
            // 有文件时：续加和清空功能可用，初始文件选择不可用
            
            // 主文件选择按钮 - 低亮
            if (mainFileButton) {
                mainFileButton.disabled = true;
                mainFileButton.classList.add('btn-disabled');
                mainFileButton.classList.remove('btn-active');
                // 移除所有颜色主题
                mainFileButton.classList.remove('export-image', 'export-pdf', 'print-preview', 'add-image', 'add-pdf', 'clear-canvas');
            }
            
            // 续加图片按钮 - 橙色主题
            if (addImageButton) {
                addImageButton.disabled = false;
                addImageButton.classList.remove('btn-disabled');
                addImageButton.classList.add('btn-active', 'add-image');
                // 移除其他主题
                addImageButton.classList.remove('export-image', 'export-pdf', 'print-preview', 'add-pdf', 'clear-canvas');
            }
            
            // 续加PDF按钮 - 粉色主题
            if (addPdfButton) {
                addPdfButton.disabled = false;
                addPdfButton.classList.remove('btn-disabled');
                addPdfButton.classList.add('btn-active', 'add-pdf');
                // 移除其他主题
                addPdfButton.classList.remove('export-image', 'export-pdf', 'print-preview', 'add-image', 'clear-canvas');
            }
            
            // 导出图片按钮 - 绿色主题（桌面端和移动端）
            if (exportBtn) {
                exportBtn.disabled = false;
                exportBtn.classList.remove('btn-disabled');
                exportBtn.classList.add('btn-active', 'export-image');
                exportBtn.classList.remove('export-pdf', 'print-preview', 'add-image', 'add-pdf', 'clear-canvas');
            }
            
            // 移动端导出图片按钮
            const mobileExportBtn = document.querySelector('.mobile-export-btn');
            if (mobileExportBtn) {
                mobileExportBtn.disabled = false;
            }
            
            // 导出PDF按钮 - 蓝色主题（桌面端和移动端）
            if (exportPdfBtn) {
                exportPdfBtn.disabled = false;
                exportPdfBtn.classList.remove('btn-disabled');
                exportPdfBtn.classList.add('btn-active', 'export-pdf');
                exportPdfBtn.classList.remove('export-image', 'print-preview', 'add-image', 'add-pdf', 'clear-canvas');
            }
            
            // 移动端导出PDF按钮
            const mobileExportPdfBtn = document.querySelector('.mobile-export-pdf-btn');
            if (mobileExportPdfBtn) {
                mobileExportPdfBtn.disabled = false;
            }
            
            // 打印预览按钮 - 紫色主题（桌面端和移动端）
            if (printPreviewBtn) {
                printPreviewBtn.disabled = false;
                printPreviewBtn.classList.remove('btn-disabled');
                printPreviewBtn.classList.add('btn-active', 'print-preview');
                printPreviewBtn.classList.remove('export-image', 'export-pdf', 'add-image', 'add-pdf', 'clear-canvas');
            }
            
            // 移动端打印预览按钮
            const mobilePrintPreviewBtn = document.querySelector('.mobile-print-preview-btn');
            if (mobilePrintPreviewBtn) {
                mobilePrintPreviewBtn.disabled = false;
            }
            
            // 清空页面按钮 - 黄色主题
            if (previewBtn) {
                previewBtn.disabled = false;
                previewBtn.classList.remove('btn-disabled');
                previewBtn.classList.add('btn-active', 'clear-canvas');
                previewBtn.classList.remove('export-image', 'export-pdf', 'print-preview', 'add-image', 'add-pdf');
            }
        }

        // 布局模式切换处理函数
        function onLayoutModeChange() {
            const newMode = getCurrentLayoutMode();
            if (newMode !== currentLayoutMode) {
                currentLayoutMode = newMode;

                // 重新初始化画布（画布尺寸会根据布局模式改变）
                initCanvas();

                // 调试信息
                const canvasSize = getCurrentCanvasSize();
                console.log(`布局切换到: ${newMode}, 画布尺寸: ${canvasSize.width} x ${canvasSize.height}`);

                // 重新计算总页数
                if (uploadedImages.length > 0) {
                    totalPages = Math.ceil(uploadedImages.length / getMaxImagesPerPage());
                    currentPage = Math.min(currentPage, Math.max(0, totalPages - 1));

                    // 更新分页控件
                    updatePaginationButtons();
                    updatePageInfo();

                    // 重新绘制当前页
                    drawCurrentPage();
                }

                showStatus(`已切换到${newMode === 'landscape' ? '两行两列横版' : '三列竖版'}布局`, 'success');
            }
        }

        // 切换调试模式
        function toggleDebugMode() {
            debugMode = !debugMode;
            if (debugMode) {
                showStatus('调试模式已开启，请查看浏览器控制台', 'info');
                console.log('=== 发票检测调试模式已开启 ===');
                console.log('将显示详细的PDF处理和内容检测信息');
            } else {
                showStatus('调试模式已关闭', 'info');
                console.log('=== 发票检测调试模式已关闭 ===');
            }
        }

        // 进度条管理
        const progressBar = {
            container: document.getElementById('progressContainer'),
            fill: document.getElementById('progressFill'),
            text: document.getElementById('progressText'),
            startTime: null,
            totalFiles: 0,

            show() {
                this.container.style.display = 'block';
                this.startTime = Date.now();
            },

            hide() {
                this.container.style.display = 'none';
                this.startTime = null;
                this.totalFiles = 0;
            },

            update(percent, message, fileName = '') {
                this.fill.style.width = percent + '%';

                // 计算剩余时间估算
                let timeEstimate = '';
                if (this.startTime && this.totalFiles > 0 && percent > 0) {
                    const elapsed = Date.now() - this.startTime;
                    const totalEstimated = (elapsed / percent) * 100;
                    const remaining = Math.max(0, totalEstimated - elapsed);
                    const remainingSeconds = Math.ceil(remaining / 1000);

                    if (remainingSeconds > 0 && remainingSeconds < 300) { // 只显示5分钟内的估算
                        timeEstimate = ` (预计剩余 ${remainingSeconds} 秒)`;
                    }
                }

                // 格式化消息
                let fullMessage = message;
                if (fileName) {
                    fullMessage = `${message} - ${fileName}`;
                }
                fullMessage += timeEstimate;

                this.text.textContent = fullMessage;
            },

            setTotal(total) {
                this.totalFiles = total;
            },

            increment(increment, message, fileName = '') {
                const currentWidth = parseFloat(this.fill.style.width) || 0;
                const newWidth = Math.min(100, currentWidth + increment);
                this.update(newWidth, message, fileName);
            },

            // 新增：显示文件处理详情
            showFileProgress(currentIndex, totalFiles, fileName, status = '处理中') {
                const percent = Math.round((currentIndex / totalFiles) * 100);
                const message = `正在${status}第 ${currentIndex}/${totalFiles} 个PDF文件`;
                this.update(percent, message, fileName);
            },

            // 新增：显示处理阶段
            showStage(stage, percent = null) {
                const stageMessages = {
                    'loading': '正在加载PDF文件',
                    'rendering': '正在渲染PDF内容',
                    'cropping': '正在检测并裁剪空白区域',
                    'converting': '正在转换为图片',
                    'finalizing': '正在完成处理'
                };

                const message = stageMessages[stage] || stage;
                const currentPercent = percent !== null ? percent : parseFloat(this.fill.style.width) || 0;
                this.update(currentPercent, message);
            }
        };

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 清理缓存
        function clearCache() {
            performanceMonitor.start('缓存清理');

            // 清理PDF缓存
            pdfCache.clear();

            // 清理图片缓存
            memoryManager.clearImageCache();

            // 优化canvas
            memoryManager.optimizeCanvas();

            // 强制垃圾回收
            performanceMonitor.cleanup();

            // 检查内存
            const memory = performanceMonitor.checkMemory();

            performanceMonitor.end('缓存清理');

            showStatus(`缓存清理完成，当前内存使用: ${memory ? memory.used + 'MB' : '未知'}`, 'success');

            if (debugMode) {
                console.log('🧹 缓存清理完成');
            }
        }

        // 优化的状态显示（防抖）
        const debouncedShowStatus = debounce((message, type = 'info') => {
            showStatus(message, type);
        }, 100);

        // 更新质量信息显示
        function updateQualityInfo() {
            const scale = getPdfRenderScale();
            if (qualityInfo) {
                qualityInfo.textContent = `当前质量: ${scale}x`;
            }
        }

        // 更新PDF导出质量信息显示
        function updatePdfExportQualityInfo() {

            const maxWidth = window.innerWidth * 0.8;
            const maxHeight = window.innerHeight * 1.1312;
            const scale = Math.min(maxWidth / canvasSize.width, maxHeight / canvasSize.height, 1);
            canvas.style.width = (canvasSize.width * scale) + 'px';
            canvas.style.height = (canvasSize.height * scale) + 'px';

            // 重置变换矩阵

            // 启用最高质量渲染
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.textRenderingOptimization = 'optimizeQuality';

            // 设置高质量渲染参数
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvasSize.width, canvasSize.height);

            // 根据布局模式绘制分隔线
            const layoutMode = getCurrentLayoutMode();

            if (layoutMode === 'landscape') {
                // 横版布局：2*2网格，只绘制十字分隔线
                ctx.strokeStyle = '#d0d0d0'; // 浅灰白色
                ctx.lineWidth = 3; // 边框线条粗细
                ctx.setLineDash([]); // 实线

                // 计算十字线位置：将画布分成2行2列
                const centerX = canvasSize.width / 2; // 垂直分隔线位置
                const centerY = canvasSize.height / 2; // 水平分隔线位置

                // 绘制垂直分隔线（将画布分成左右两部分）
                ctx.beginPath();
                ctx.moveTo(centerX, 0);
                ctx.lineTo(centerX, canvasSize.height);
                ctx.stroke();

                // 绘制水平分隔线（将画布分成上下两部分）
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(canvasSize.width, centerY);
                ctx.stroke();

            } else {
                // 竖版布局：三列，绘制水平分隔线
                for (let i = 1; i < 3; i++) {
                    const y = i * SECTION_HEIGHT;

                    // 绘制间隔区域（白色背景）
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, y - INVOICE_SPACING / 2, canvasSize.width, INVOICE_SPACING);

                    ctx.strokeStyle = '#d0d0d0'; // 浅灰白色
                    ctx.lineWidth = INVOICE_LINE_HEIGHT;
                    ctx.setLineDash([]); // 实线
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasSize.width, y);
                    ctx.stroke();
                }
            }

        // 检测图片中的空白区域
        function detectContentBounds(canvas, threshold = 0.95) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
            let hasContent = false;
            let totalBrightness = 0;
            let pixelCount = 0;

            // 首先计算整体亮度分布
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const brightness = (r + g + b) / 3;
                    totalBrightness += brightness;
                    pixelCount++;
                }
            }

            const avgBrightness = totalBrightness / pixelCount;
            if (debugMode) {
                console.log('=== 内容检测调试信息 ===');
                console.log('画布尺寸:', canvas.width, 'x', canvas.height);
                console.log('总像素数:', pixelCount);
                console.log('平均亮度:', avgBrightness.toFixed(2));
            }

            // 根据平均亮度动态调整白色阈值
            const whiteThreshold = Math.max(240, avgBrightness + 30);
            if (debugMode) {
                console.log('白色阈值:', whiteThreshold);
            }

            // 重新遍历像素数据，寻找非白色像素
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    // 跳过完全透明的像素
                    if (a === 0) continue;

                    const brightness = (r + g + b) / 3;

                    // 更智能的内容检测：
                    // 1. 亮度低于阈值
                    // 2. 或者RGB值差异较大（彩色内容）
                    // 3. 或者有明显的对比度变化
                    const hasLowBrightness = brightness < whiteThreshold;
                    const hasColorVariation = Math.abs(r - g) > 15 || Math.abs(g - b) > 15 || Math.abs(r - b) > 15;
                    const isDarkContent = (r < 200 && g < 200 && b < 200);

                    if (hasLowBrightness || hasColorVariation || isDarkContent) {
                        hasContent = true;
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            }

            if (!hasContent) {
                if (debugMode) {
                    console.log('未检测到内容，返回完整画布');
                }
                return null; // 没有检测到内容，返回null表示不裁剪
            }

            // 添加一些边距
            const margin = 15;
            const bounds = {
                x: Math.max(0, minX - margin),
                y: Math.max(0, minY - margin),
                width: Math.min(canvas.width - minX, maxX - minX + 2 * margin),
                height: Math.min(canvas.height - minY, maxY - minY + 2 * margin)
            };

            if (debugMode) {
                console.log('检测到的内容边界:', bounds);
                console.log('内容区域占比:', ((bounds.width * bounds.height) / (canvas.width * canvas.height) * 100).toFixed(2) + '%');
            }
            return bounds;
        }

        // 备用内容检测方法（更宽松的检测条件）
        function detectContentBoundsRelaxed(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
            let hasContent = false;

            // 使用非常宽松的检测条件
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    // 跳过完全透明的像素
                    if (a === 0) continue;

                    // 非常宽松的条件：只要不是接近纯白色就认为是内容
                    const isNearWhite = (r > 245 && g > 245 && b > 245);

                    if (!isNearWhite) {
                        hasContent = true;
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            }

            if (!hasContent) {
                console.log('备用检测：未检测到内容');
                return null;
            }

            // 添加较大的边距
            const margin = 25;
            const bounds = {
                x: Math.max(0, minX - margin),
                y: Math.max(0, minY - margin),
                width: Math.min(canvas.width - minX, maxX - minX + 2 * margin),
                height: Math.min(canvas.height - minY, maxY - minY + 2 * margin)

        }

        // 检测图像中是否已有红色边框
        async function checkForRedBorder(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            const borderWidth = Math.min(20, Math.min(canvas.width, canvas.height) / 10); // 边框检测宽度
            let redPixelCount = 0;
            let totalBorderPixels = 0;

            // 检查上边框
            for (let x = 0; x < canvas.width; x++) {
                for (let y = 0; y < borderWidth; y++) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];

                    totalBorderPixels++;
                    // 检测红色像素 (R值高，G和B值低)
                    if (r > 150 && g < 100 && b < 100) {
                        redPixelCount++;
                    }
                }
            }

            // 检查下边框
            for (let x = 0; x < canvas.width; x++) {
                for (let y = canvas.height - borderWidth; y < canvas.height; y++) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];

                    totalBorderPixels++;
                    if (r > 150 && g < 100 && b < 100) {
                        redPixelCount++;
                    }
                }
            }

            // 检查左边框
            for (let x = 0; x < borderWidth; x++) {
                for (let y = 0; y < canvas.height; y++) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];

                    totalBorderPixels++;
                    if (r > 150 && g < 100 && b < 100) {
                        redPixelCount++;
                    }
                }
            }

            // 检查右边框
            for (let x = canvas.width - borderWidth; x < canvas.width; x++) {
                for (let y = 0; y < canvas.height; y++) {
                    const index = (y * canvas.width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];

                    totalBorderPixels++;
                    if (r > 150 && g < 100 && b < 100) {
                        redPixelCount++;
                    }
                }
            }

            const redPixelRatio = redPixelCount / totalBorderPixels;

            if (debugMode) {
                console.log(`红色边框检测: 红色像素 ${redPixelCount}/${totalBorderPixels}, 比例: ${(redPixelRatio * 100).toFixed(2)}%`);
            }

            // 如果红色像素占比超过10%，认为有红色边框
            return redPixelRatio > 0.1;

        // 为图像添加红色边框
        function addRedBorder(canvas) {
            const newCanvas = document.createElement('canvas');
            const newCtx = newCanvas.getContext('2d');

            // 设置新画布尺寸（添加边框空间）
            const borderSize = Math.max(10, Math.min(canvas.width, canvas.height) * 0.02); // 边框厚度
            newCanvas.width = canvas.width + 2 * borderSize;
            newCanvas.height = canvas.height + 2 * borderSize;

            // 填充白色背景
            newCtx.fillStyle = 'white';
            newCtx.fillRect(0, 0, newCanvas.width, newCanvas.height);

            // 绘制红色边框
            newCtx.strokeStyle = '#FF0000'; // 鲜红色
            newCtx.lineWidth = borderSize;
            newCtx.strokeRect(borderSize / 2, borderSize / 2, canvas.width + borderSize, canvas.height + borderSize);

            // 绘制原始图像
            newCtx.drawImage(canvas, borderSize, borderSize, canvas.width, canvas.height);

            if (debugMode) {
                console.log(`已添加红色边框，边框厚度: ${borderSize}px`);

            return newCanvas;
